<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- dark background -->
  <rect width="32" height="32" rx="8" fill="#0a0a0a"/>

  <!-- outer glow ring -->
  <circle cx="16" cy="16" r="13" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>

  <!-- mic capsule -->
  <rect x="12" y="6" width="8" height="12" rx="4" fill="#3b82f6"/>

  <!-- mic shine highlight -->
  <rect x="13.5" y="7.5" width="2.5" height="4" rx="1.25" fill="#93c5fd" fill-opacity="0.65"/>

  <!-- mic stand arc -->
  <path d="M9 16 Q9 23 16 23 Q23 23 23 16" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- stand pole -->
  <line x1="16" y1="23" x2="16" y2="27" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/>

  <!-- base line -->
  <line x1="12" y1="27" x2="20" y2="27" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

  <!-- pulse dot — top right (matches navbar logo) -->
  <circle cx="26" cy="6" r="4" fill="#3b82f6"/>
  <circle cx="26" cy="6" r="2.2" fill="#bfdbfe"/>
</svg>
